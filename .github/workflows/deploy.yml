# Every push to main that changes the site redeploys it (S3 + CloudFront).
# Also run it after deploying IncidentScribe, so the live demo page gets its API URL.
name: Deploy
on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "build.py", "infra/**", "scripts/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: aws-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python3 tests/check_site.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: portfolio-deploy
      - name: Deploy
        shell: bash  # -o pipefail: a failed up.sh must fail the step, even piped into tee
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          # Optional custom domain (repository variables), see README
          TF_VAR_domain_name: ${{ vars.PORTFOLIO_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ vars.PORTFOLIO_ZONE_ID }}
          TF_VAR_extra_domain_names: ${{ vars.PORTFOLIO_EXTRA_DOMAINS || '[]' }}
        run: bash scripts/up.sh | tee deploy.log
      - name: Summary
        run: grep -o 'https://[^ ]*' deploy.log | tail -1 | sed 's/^/Live at /' >> "$GITHUB_STEP_SUMMARY"
